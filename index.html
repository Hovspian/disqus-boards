<head>
  <meta property="og:image" content="disqus-icon-dark.png">
  <meta property="og:title" content="Disqus Articles">
  <title>Disqus Forums</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    a {
      color: #2e9fff;
    }
  </style>
  <script>
    // Restore deep paths handed off by /404.html before any other script.
    // Adapted from https://github.com/rafgraph/spa-github-pages.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&'); })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
</head>
<body>
  <div id="disqus-boards-host"></div>
  <script>
    window.disqus_boards_config = function () {
      this.routerMode = 'history'
      // Include the project subdirectory — window.location.pathname does too.
      this.basePath = '/disqus-boards/forums'
    }
  </script>
  <script>
    (function() {
      if (document.getElementById('disqus_boards_script')) return;
      var d = document, s = d.createElement('script');
      s.id = 'disqus_boards_script';
      s.src = 'https://hovseptestrealm.disqus.com/boards.js';
      (d.head || d.body).appendChild(s);
    })();
  </script>
</body>
